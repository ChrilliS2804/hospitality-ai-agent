name: Deploy to Dev

on:
  push:
    branches: [main]

env:
  TF_VERSION: "1.7.5"
  AWS_REGION: eu-central-1
  PYTHON_VERSION: "3.12"

jobs:
  deploy-infrastructure:
    name: Terraform Apply (dev)
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      lambda_packages_bucket: ${{ steps.tf-outputs.outputs.lambda_packages_bucket }}
      call_handler_name: ${{ steps.tf-outputs.outputs.call_handler_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: terraform/environments/dev
        run: terraform init -backend-config=backend.tfvars

      - name: Terraform apply
        working-directory: terraform/environments/dev
        run: terraform apply -var-file=terraform.tfvars -auto-approve
        env:
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Capture Terraform outputs
        id: tf-outputs
        working-directory: terraform/environments/dev
        run: |
          echo "lambda_packages_bucket=$(terraform output -raw lambda_packages_bucket)" >> $GITHUB_OUTPUT
          echo "call_handler_name=$(terraform output -raw call_handler_function_name)" >> $GITHUB_OUTPUT

  deploy-lambda:
    name: Deploy Lambda Functions
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Build shared Lambda layer
        run: |
          mkdir -p build/layer/python
          pip install -r services/shared/requirements.txt -t build/layer/python
          cd build/layer && zip -r ../../build/shared-layer.zip python/

      - name: Package call-handler
        run: |
          cd services/call-handler
          zip -r ../../build/call-handler.zip . \
            -x "tests/*" "*.pyc" "__pycache__/*" "*.egg-info/*"

      - name: Upload packages to S3
        run: |
          BUCKET=${{ needs.deploy-infrastructure.outputs.lambda_packages_bucket }}
          aws s3 cp build/shared-layer.zip s3://${BUCKET}/shared-layer.zip
          aws s3 cp build/call-handler.zip s3://${BUCKET}/call-handler.zip

      - name: Update Lambda function code
        run: |
          BUCKET=${{ needs.deploy-infrastructure.outputs.lambda_packages_bucket }}
          FUNCTION=${{ needs.deploy-infrastructure.outputs.call_handler_name }}
          aws lambda update-function-code \
            --function-name ${FUNCTION} \
            --s3-bucket ${BUCKET} \
            --s3-key call-handler.zip \
            --publish

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name ${{ needs.deploy-infrastructure.outputs.call_handler_name }}

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy-lambda
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: pip install boto3==1.34.110

      - name: Invoke call-handler smoke test
        run: python scripts/smoke_test_call_handler.py
        env:
          FUNCTION_NAME: ${{ needs.deploy-infrastructure.outputs.call_handler_name }}
