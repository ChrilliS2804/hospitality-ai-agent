name: Deploy to Prod

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy-prod' to confirm production deployment"
        required: true

env:
  TF_VERSION: "1.7.5"
  AWS_REGION: eu-central-1

jobs:
  guard:
    name: Confirm Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy-prod" ]; then
            echo "Confirmation input did not match. Aborting."
            exit 1
          fi

  deploy-infrastructure:
    name: Terraform Apply (prod)
    runs-on: ubuntu-latest
    needs: guard
    environment: prod   # Requires GitHub environment protection rules + reviewer approval
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: terraform/environments/prod
        run: terraform init -backend-config=backend.tfvars

      - name: Terraform apply
        working-directory: terraform/environments/prod
        run: terraform apply -var-file=terraform.tfvars -auto-approve
        env:
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}

  deploy-lambda:
    name: Deploy Lambda (canary)
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and upload packages
        run: |
          pip install -r requirements-dev.txt
          mkdir -p build/layer/python
          pip install -r services/shared/requirements.txt -t build/layer/python
          cd build/layer && zip -r ../../build/shared-layer.zip python/ && cd ../..
          cd services/call-handler
          zip -r ../../build/call-handler.zip . -x "tests/*" "*.pyc" "__pycache__/*"
          cd ../..
          aws s3 cp build/shared-layer.zip s3://${{ secrets.PROD_LAMBDA_BUCKET }}/shared-layer.zip
          aws s3 cp build/call-handler.zip s3://${{ secrets.PROD_LAMBDA_BUCKET }}/call-handler.zip

      - name: Publish new Lambda version
        id: publish
        run: |
          VERSION=$(aws lambda update-function-code \
            --function-name hospitality-ai-prod-call-handler \
            --s3-bucket ${{ secrets.PROD_LAMBDA_BUCKET }} \
            --s3-key call-handler.zip \
            --publish \
            --query 'Version' --output text)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Canary — shift 10% traffic to new version
        run: |
          aws lambda update-alias \
            --function-name hospitality-ai-prod-call-handler \
            --name LIVE \
            --routing-config AdditionalVersionWeights={"${{ steps.publish.outputs.version }}"=0.1}

      - name: Wait 5 minutes and check error rate
        run: sleep 300

      - name: Promote to 100% if healthy
        run: |
          ERROR_RATE=$(aws cloudwatch get-metric-statistics \
            --namespace AWS/Lambda \
            --metric-name Errors \
            --dimensions Name=FunctionName,Value=hospitality-ai-prod-call-handler \
            --start-time $(date -u -d '5 minutes ago' +%Y-%m-%dT%H:%M:%SZ) \
            --end-time $(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --period 300 --statistics Sum \
            --query 'Datapoints[0].Sum' --output text)
          if [ "${ERROR_RATE}" = "None" ] || [ "${ERROR_RATE}" = "0.0" ]; then
            aws lambda update-alias \
              --function-name hospitality-ai-prod-call-handler \
              --name LIVE \
              --function-version ${{ steps.publish.outputs.version }} \
              --routing-config AdditionalVersionWeights={}
            echo "Canary promoted to 100%"
          else
            echo "Errors detected (${ERROR_RATE}), rolling back"
            aws lambda update-alias \
              --function-name hospitality-ai-prod-call-handler \
              --name LIVE \
              --routing-config AdditionalVersionWeights={}
            exit 1
          fi
