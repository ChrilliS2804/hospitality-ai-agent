name: Terraform CI

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
  push:
    branches: [main]
    paths:
      - "terraform/**"

env:
  TF_VERSION: "1.7.5"
  AWS_REGION: eu-central-1

jobs:
  fmt-validate:
    name: Format & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform format check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform validate (dev)
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false
          terraform validate

  security-scan:
    name: Checkov Security Scan
    runs-on: ubuntu-latest
    needs: fmt-validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checkov
        run: pip install checkov==3.2.88

      - name: Run checkov
        run: |
          checkov -d terraform/modules \
            --framework terraform \
            --quiet \
            --compact \
            --skip-check CKV_AWS_117,CKV_AWS_116
            # CKV_AWS_117: Lambda VPC — optional for dev
            # CKV_AWS_116: Lambda DLQ — added in Sprint 5

  plan-dev:
    name: Terraform Plan (dev)
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.event_name == 'pull_request'
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: terraform/environments/dev
        run: terraform init -backend-config=backend.tfvars

      - name: Terraform plan
        working-directory: terraform/environments/dev
        run: |
          terraform plan \
            -var-file=terraform.tfvars \
            -out=tfplan \
            -no-color
        env:
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: terraform/environments/dev/tfplan
