[pytest]
testpaths = services tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers --tb=short -v
markers =
    unit: unit tests (no AWS dependencies)
    integration: integration tests (requires moto or real AWS)
    e2e: end-to-end tests (requires deployed environment)
pythonpath =
    services/shared
    services/call-handler
    services/reservation-service
    services/faq-service
    services/notification-service
    services/handoff-service
